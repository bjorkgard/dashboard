changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance and dependencies
      labels:
        - maintenance
        - dependencies
    - title: Other changes
      labels:
        - "*"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dayboard"
version = "0.2.0"
description = "A local-first terminal workspace for macOS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2,<8",
    "httpx>=0.28,<0.29",
    "textual>=6.6,<9",
    "platformdirs>=4.3,<5",
    "keyring>=25.6,<26",
]

[project.urls]
Repository = "https://github.com/bjorkgard/dashboard"
Issues = "https://github.com/bjorkgard/dashboard/issues"
Releases = "https://github.com/bjorkgard/dashboard/releases"

[project.scripts]
dayboard = "dayboard.cli:main"

[project.optional-dependencies]
dev = [
    "types-psutil>=7,<8",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dayboard"]
